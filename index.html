<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odd One Out</title><style>
:root{--ink:#fff5f0;--muted:#c2afb5;--purple:#e24c68;--lime:#f1bd74;--paper:#09070a;--line:#482431;--white:#171116;--gold:#f2c17d;--panel:#151015;--panel2:#20151c;--burgundy:#5d1028;--burgundy-bright:#a92749}*{box-sizing:border-box}html{min-height:100%;background:var(--paper)}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 50% -18%,#5a1328 0,transparent 48%),radial-gradient(ellipse at 100% 65%,#220d17 0,transparent 42%),var(--paper);color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:24px 26px 54px}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:54px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.2px;color:#fff8f3}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#f1c27d,#d99154);color:#230b14;font-size:21px;box-shadow:0 0 22px #e9a95d55}.nav small{color:#d8b6ae;font-size:11px;letter-spacing:2px;font-weight:800}.home{display:grid;grid-template-columns:1.1fr .9fr;gap:66px;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:850;color:var(--gold)}h1{font-size:clamp(48px,7vw,84px);line-height:.98;letter-spacing:-4.5px;margin:20px 0 22px;max-width:570px;color:#fff5f0}h1 em{font-style:normal;color:#ed6680}.lead{font-size:18px;color:#d0bec3;max-width:455px;line-height:1.65}.card{background:linear-gradient(145deg,#1b141a,#110d12 75%);border:1px solid #4a2632;border-radius:22px;padding:28px;box-shadow:0 18px 55px #0008, inset 0 1px #ffffff08}.tabs{display:flex;background:#0c090c;border:1px solid #38202a;border-radius:12px;padding:4px;margin-bottom:23px}.tabs button{flex:1;border:0;background:transparent;padding:12px 10px;border-radius:9px;color:#c6b2b8;font-weight:750;min-height:46px}.tabs button.on{background:#4e1728;color:#fff5f0;box-shadow:0 2px 12px #0008,inset 0 0 0 1px #a8495d66}.field{display:block;font-size:12px;color:#e4c4bd;font-weight:800;letter-spacing:.8px;margin:16px 0 7px}.input{width:100%;min-height:50px;border:1px solid #60404a;border-radius:11px;padding:13px 15px;background:#100d11;outline:none;color:#fff5f0}.input::placeholder{color:#a58e96}.input:focus{border-color:#e2667d;box-shadow:0 0 0 3px #e24c682d}.primary,.secondary{width:100%;min-height:50px;border:1px solid transparent;border-radius:11px;padding:13px 16px;font-weight:850;margin-top:13px;transition:background .18s,border-color .18s,transform .18s;color:#fff8f2}.primary{background:linear-gradient(115deg,#891d3b,#b52b4b);box-shadow:0 6px 18px #6e163633}.primary:hover{background:linear-gradient(115deg,#a52b4a,#cc3c5d);transform:translateY(-1px)}.primary:disabled{opacity:.46;cursor:not-allowed;transform:none;box-shadow:none}.secondary{background:#25171f;border-color:#53303c;color:#f4d8d2}.secondary:hover{background:#38202b;border-color:#8e4557}.note{color:#bba8af;font-size:13px;text-align:center;margin:14px 0 0}.error{color:#ffe5e5;background:#571725;border:1px solid #a64252;border-radius:10px;padding:11px 13px;font-size:14px;margin:0 0 15px}.roomhead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.roomcode{font-size:15px;font-weight:900;color:#25130d;background:linear-gradient(135deg,#f0ca8b,#d9965c);padding:10px 14px;border-radius:10px;letter-spacing:1.5px;box-shadow:0 0 18px #e6aa6040}.status{color:#c5b1b8;font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.maincard{min-height:410px;padding:34px}.sidebar{padding:24px}.phase{display:inline-block;border:1px solid #71364a;border-radius:20px;padding:6px 11px;background:#351521;color:#f1b8ae;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:1px}.maincard h2{font-size:clamp(27px,4vw,36px);line-height:1.13;letter-spacing:-1px;margin:16px 0 8px;color:#fff5f0}.sub{color:#c5b2b8;margin:0 0 24px}.prompt{padding:24px;border:1px solid #613044;border-radius:16px;background:radial-gradient(ellipse at 100% 0,#481628,#1a1118 66%);color:#fff6ef;margin:22px 0;font-weight:800;font-size:clamp(21px,3vw,28px);letter-spacing:-.35px;box-shadow:inset 0 1px #ffffff0b}.prompt small{display:block;color:#f0bf80;text-transform:uppercase;letter-spacing:1.6px;font-size:10px;margin-bottom:9px}.players{display:grid;gap:9px;margin-top:17px}.player{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #412832;background:#120e12;padding:12px;border-radius:12px;font-size:14px;color:#fff2ed}.player.me{border-color:#a94c61;background:#2a151e}.pill{color:#c8aeb6;font-size:11px}.score{font-weight:900;color:#f0bd78}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:22px 0}.answer{background:#1d151b;border:1px solid #422834;padding:13px;border-radius:12px;min-width:0}.answer strong{font-size:12px;display:block;color:#e5b8a7;margin-bottom:5px}.answer span{font-weight:750;color:#fff6f0;overflow-wrap:anywhere}.votegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}.vote{min-height:48px;border:1px solid #62404b;background:#191218;color:#fff3ee;border-radius:12px;padding:12px;font-weight:750;text-align:left}.vote:hover{border-color:#ee7588;background:#3a1825}.vote:focus-visible,.primary:focus-visible,.secondary:focus-visible,.tabs button:focus-visible{outline:3px solid #f1bd74;outline-offset:2px}.vote:disabled{opacity:.55;cursor:default}.hostbtn{margin-top:16px}.winner{background:linear-gradient(110deg,#4c1c2a,#2a171e);border:1px solid #ad754c;color:#ffe1aa;padding:15px;border-radius:12px;margin:15px 0;font-weight:850}.how{display:flex;gap:18px;margin-top:30px;flex-wrap:wrap}.how span{font-size:13px;color:#c5b2b8}.how b{color:#f0bd78;margin-right:4px}@media(max-width:760px){.shell{padding:17px 15px 32px}.nav{margin-bottom:32px}.nav small{font-size:9px;letter-spacing:1.2px}.home{grid-template-columns:1fr;gap:25px}.home>div:first-child{text-align:left}h1{font-size:clamp(46px,12vw,68px);letter-spacing:-3px;margin:15px 0}.lead{font-size:16px}.how{gap:10px 16px;margin-top:20px}.how span{font-size:12px}.card{padding:21px;border-radius:18px}.layout{grid-template-columns:1fr;gap:14px}.maincard{min-height:0;padding:21px}.sidebar{order:2;padding:20px}.maincard h2{font-size:clamp(27px,8vw,34px)}.prompt{padding:20px;margin:18px 0;font-size:clamp(21px,6vw,26px)}.roomhead{align-items:flex-start}.roomhead .eyebrow{font-size:10px}.roomcode{font-size:13px;padding:9px 11px}.status{font-size:13px}.roomhead .secondary{padding:10px 12px;min-height:44px}.answers{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.answer{padding:11px}.votegrid{grid-template-columns:1fr 1fr}.tabs button{font-size:14px}.input,.primary,.secondary{font-size:16px}.player{font-size:14px}}@media(max-width:390px){.shell{padding-inline:12px}.card,.maincard,.sidebar{padding:17px}.nav small{display:none}.roomhead{flex-wrap:wrap}.roomhead>div{min-width:55%}.roomhead .secondary{margin-left:auto}.votegrid{grid-template-columns:1fr}.answers{grid-template-columns:1fr 1fr}.how{gap:8px 12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div id="app"></div><script>
const app=document.querySelector('#app');
const GAME_ENDPOINT='/.netlify/functions/game';
const POLL_MS=900;
let game=null,error='',tab='create',stateTimer=null,busy=false,lastState='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saved=()=>{try{return JSON.parse(sessionStorage.getItem('oddOneOut')||'null')}catch{return null}};
async function request(action,data={}){let r=await fetch(GAME_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},cache:'no-store',body:JSON.stringify({action,...data})});let j=await r.json();if(!r.ok)throw Error(j.error||'Something went wrong.');return j}
async function fetchState(x=saved()){if(!x)return null;let u=GAME_ENDPOINT+'?code='+encodeURIComponent(x.code)+'&token='+encodeURIComponent(x.token);let r=await fetch(u,{cache:'no-store'});let j=await r.json();if(!r.ok)throw Error(j.error||'Could not load this room.');return j}
function enter(x){sessionStorage.setItem('oddOneOut',JSON.stringify(x));error='';lastState='';connect()}
function connect(){if(stateTimer)clearInterval(stateTimer);syncState();stateTimer=setInterval(syncState,POLL_MS)}
async function syncState(){try{let next=await fetchState();if(!next)return;let signature=JSON.stringify(next);if(signature!==lastState){lastState=signature;game=next;error='';render()}}catch(e){if(game){error=e.message;render()}else if(saved()){error=e.message;render()}}}
function btn(label,fn,cls='primary',disabled=false){return `<button class="${cls}" ${disabled?'disabled':''} onclick="${fn}">${label}</button>`}
function landing(){let x=saved();return `<div class="shell"><header class="nav"><div class="brand"><span class="mark">◎</span> odd one out</div><small>THE QUICK THINKING PARTY GAME</small></header><section class="home"><div><div class="eyebrow">A little different</div><h1>Blend in.<br><em>Stand out.</em></h1><p class="lead">Everyone gets a secret prompt. One player gets a different one. Can the odd one out keep their cover?</p><div class="how"><span><b>01</b> Answer in secret</span><span><b>02</b> Talk it out</span><span><b>03</b> Find the odd one</span></div></div><div class="card"><div class="tabs"><button class="${tab==='create'?'on':''}" onclick="tab='create';render()">Create room</button><button class="${tab==='join'?'on':''}" onclick="tab='join';render()">Join a room</button></div><form onsubmit="submitRoom(event)"><label class="field">YOUR NAME</label><input class="input" name="name" maxlength="18" placeholder="e.g. Alex" required><div id="codefield" style="display:${tab==='join'?'block':'none'}"><label class="field">ROOM CODE</label><input class="input" name="code" maxlength="6" placeholder="ABC123" style="text-transform:uppercase"></div><button class="primary" ${busy?'disabled':''}>${tab==='create'?'Create a room →':'Join the game →'}</button></form>${error?`<div class="error">${esc(error)}</div>`:''}<p class="note">2–8 players · 5 rounds · no downloads needed</p>${x?`<button class="secondary" onclick="rejoin()">Rejoin ${esc(x.code)}</button>`:''}</div></section></div>`}
function gamePage(){let phase=game.phase,phaseTitle={lobby:'Waiting room',answer:'Secret prompt',discuss:'Talk it out',vote:'Make your pick',results:'Round results',done:'That’s a wrap'}[phase]||'Game';let main='';
if(phase==='lobby')main=`<span class="phase">Waiting room</span><h2>Get everyone in.</h2><p class="sub">Share the room code. The game starts when at least two players have joined.</p><div class="prompt"><small>Room code</small>${esc(game.code)}</div>${game.host?btn('Start game →',"act('start')",'primary hostbtn',game.players.length<2):'<p class="sub">The host will start the game when everyone is ready.</p>'}`;
if(phase==='answer')main=`<span class="phase">Round ${game.round} of ${game.maxRounds} · Answer</span><h2>Your secret prompt</h2><p class="sub">Keep it to yourself. You have up to two minutes to answer.</p><div class="prompt"><small>Only you can see this</small>${esc(game.prompt)}</div><form onsubmit="submitAnswer(event)"><input class="input" name="answer" maxlength="36" placeholder="Your answer…" value="${esc(game.myAnswer)}" ${game.myAnswer?'disabled':''} required>${game.myAnswer?'<p class="sub" style="margin:10px 0 0">Answer locked in. Waiting for everyone…</p>':btn('Lock in answer →','', 'primary')}</form>`;
if(phase==='discuss'||phase==='vote')main=`<span class="phase">Round ${game.round} of ${game.maxRounds} · ${phase==='vote'?'Voting':'Discussion'}</span><h2>${phase==='vote'?'Who had a different prompt?':'Compare your answers.'}</h2><p class="sub">Discuss the answers, then vote for who you think got the odd prompt.</p><div class="answers">${game.answers.map(a=>`<div class="answer"><strong>${esc(a.name)}</strong><span>${esc(a.answer)}</span></div>`).join('')}</div><div class="votegrid">${game.players.filter(p=>!p.isMe).map(p=>`<button class="vote" onclick="vote('${esc(p.name)}')" ${game.myVote?'disabled':''}>${esc(p.name)}${game.myVote===p.name?' · Voted':''}</button>`).join('')}</div>${game.myVote?'<p class="sub" style="margin-top:14px">Vote locked. Waiting for the room…</p>':''}`;
if(phase==='results'||phase==='done')main=`<span class="phase">${phase==='done'?'Game complete':`Round ${game.round} results`}</span><h2>${phase==='done'?'Nice playing.':`The odd one was ${esc(game.odd)}!`}</h2><p class="sub">${(game.prompts||[]).map(esc).join(' · ')}</p>${phase==='done'?`<div class="winner">🏆 ${esc((game.winners||[game.winner]).join(' & '))} wins${(game.winners||[]).length>1?' (tie!)':''}</div>`:`<p class="sub">${esc(game.odd)} ${game.escaped?'earned 2 points by blending in.':'was spotted.'}</p>`}<div class="answers">${game.players.map(p=>`<div class="answer"><strong>${esc(p.name)}</strong><span>${p.score} pts</span></div>`).join('')}</div>${game.host?btn(phase==='done'?'Play again':'Next round →',"act('advance')",'primary hostbtn'):''}`;
return `<div class="shell"><header class="nav"><div class="brand"><span class="mark">◎</span> odd one out</div><div class="roomcode">${esc(game.code)}</div></header><div class="roomhead"><div><div class="eyebrow">${phaseTitle}</div><div class="status">${game.players.length} players · ${phase==='lobby'?'Waiting to start':`Round ${game.round} of ${game.maxRounds}`}</div></div><button class="secondary" style="width:auto;margin:0" onclick="copyCode()">Copy code</button></div><section class="layout"><div class="card maincard">${error?`<div class="error">${esc(error)}</div>`:''}${main}</div><aside class="card sidebar"><div class="eyebrow">Players · ${game.players.length}/8</div><div class="players">${game.players.map(p=>`<div class="player ${p.isMe?'me':''}"><span>${esc(p.name)}${p.isMe?' <span class="pill">YOU</span>':''}</span><span class="score">${p.score} <span class="pill">pts</span></span></div>`).join('')}</div><p class="note" style="text-align:left;margin-top:18px">Correct vote: +1 point<br>Odd one escapes: +2 points<br>Most points after ${game.maxRounds} rounds wins.</p></aside></section></div>`}
function render(){app.innerHTML=game?gamePage():landing()}
async function submitRoom(e){e.preventDefault();let f=new FormData(e.currentTarget),name=f.get('name'),code=f.get('code');if(busy)return;busy=true;error='';render();try{let x=tab==='create'?await request('create',{name}):await request('join',{name,code});enter(x)}catch(e){error=e.message;render()}finally{busy=false}}
async function act(action){try{game=await request(action,saved());error='';lastState=JSON.stringify(game);render()}catch(e){error=e.message;render()}}
async function submitAnswer(e){e.preventDefault();let value=new FormData(e.currentTarget).get('answer');try{game=await request('answer',{...saved(),answer:value});error='';lastState=JSON.stringify(game);render()}catch(e){error=e.message;render()}}
async function vote(name){try{game=await request('vote',{...saved(),target:name});error='';lastState=JSON.stringify(game);render()}catch(e){error=e.message;render()}}
async function copyCode(){try{await navigator.clipboard.writeText(game.code);error='Room code copied!';render();setTimeout(()=>{error='';render()},1400)}catch{}}
function rejoin(){if(saved())connect()}
render();
</script></body></html>
